<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Malspiikki Entertainment</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0 4%;
}

.logo {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 1em;
  margin: 3rem 0;
}
.logo img {
  width: clamp(60px, 20vw, 100px);
  height: auto;
}
.logo h1 {
  margin: 0;
  text-align: left;
  text-transform: uppercase;
  font-size: clamp(1.75rem, 9vw, 3em);
  /* An em value so both lines share one leading; a unitless line-height
     would be recomputed against each line's own font-size. */
  line-height: 1.05em;
}
/* Sized so the second line comes out as wide as the first. The ratio is the
   measured width of MALSPIIKKI over ENTERTAINMENT, so it only holds for a
   sans-serif of roughly these proportions. */
.logo h1 span {
  display: block;
  font-size: 0.69em;
}

@media (max-width: 600px) {
  .logo {
    flex-direction: column;
  }
  .logo h1 {
    text-align: center;
  }
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 400px));
  justify-content: center;
  gap: 2.5rem;
  margin: 0 auto 3rem;
}

/* The window and the title lead to the same place, so they light up together. */
.game {
  --lean: 1;
}
.game:has(:any-link:hover),
.game:has(:any-link:focus-visible) {
  --lean: 1.04;
}

.game_window {
  display: block;
  position: relative;
  overflow: hidden;
  border-radius: 6px;
}
.game_window::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, 0.25),
    inset 0 0 24px rgba(0, 0, 0, 0.2);
  pointer-events: none;
}
.game_image {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  /* Lean in towards the window rather than lifting the card. */
  transform: scale(var(--lean));
  transition: transform 0.4s ease;
}

.game_title {
  margin: 0.75em 0 0.3em;
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.game_title a {
  color: inherit;
  text-decoration: none;
}
.game:has(:any-link:hover) .game_title a,
.game:has(:any-link:focus-visible) .game_title a {
  text-decoration: underline;
}
.game_title a:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 3px;
}
.game_description {
  margin: 0;
}

@media (prefers-reduced-motion: reduce) {
  .game_image {
    transform: none;
    transition: none;
  }
}
    </style>
  </head>
  <body>
    <div class="logo">
      <img src="malspiikki.svg" alt="" width="100" />
      <h1>Malspiikki<span>Entertainment</span></h1>
    </div>
    <div class="gallery">
      <div class="game">
        <!-- Same destination as the title link, so it is hidden from assistive
             tech to keep one entry per game in the links list. The alt text is
             only a fallback for a missing screenshot. -->
        <a class="game_window" href="./sanapato/" aria-hidden="true" tabindex="-1">
          <img src="screenshots/sanapato.png" alt="Sanapato — a beaver beside a pyramid of word tiles." class="game_image" />
        </a>
        <h2 class="game_title"><a href="./sanapato/">Sanapato</a></h2>
        <p class="game_description">Help the beaver solve daily challenges.</p>
      </div>
    </div>
  </body>
</html>
