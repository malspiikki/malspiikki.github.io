<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sanapato">
  <title>Sanapato</title>
  <!-- The beaver's head from src/beaver.ts, on a fire-orange field. Proportions
       follow drawBeaver() (head r = 0.24s, ears at ±0.2s, snout at +0.08s, eyes
       at ±0.1s) so the icon and the in-game beaver are the same character.

       Icon-only deviations, all in service of reading at 16px: a dark outline
       the canvas beaver doesn't have, incisors nearly twice their relative size,
       and small ears tucked to the crown. Full-size round ears made it read as
       a bear — the teeth are the only thing that says "beaver" at tab size, so
       they get the space. -->

  <rect width="64" height="64" rx="14" fill="#e8722c"/>

  <g stroke="#3d2513" stroke-width="2">
    <!-- Ears -->
    <circle cx="17" cy="21.5" r="4" fill="#6b4526"/>
    <circle cx="47" cy="21.5" r="4" fill="#6b4526"/>
    <!-- Head -->
    <ellipse cx="32" cy="35.5" rx="20.5" ry="19.2" fill="#8a5a34"/>
  </g>

  <!-- Snout, nose, philtrum -->
  <ellipse cx="32" cy="42.4" rx="12.6" ry="9.6" fill="#d9ad7d"/>
  <ellipse cx="32" cy="37.6" rx="5" ry="3.5" fill="#33200f"/>
  <path d="M32 41v3" stroke="#33200f" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Incisors -->
  <rect x="26.4" y="43.6" width="5" height="9.6" rx="1.2" fill="#fbf6ec" stroke="#3d2513" stroke-width="1.4"/>
  <rect x="32.6" y="43.6" width="5" height="9.6" rx="1.2" fill="#fbf6ec" stroke="#3d2513" stroke-width="1.4"/>

  <!-- Eyes, with the catchlight the canvas beaver also has -->
  <ellipse cx="22.4" cy="32.6" rx="4.6" ry="5.1" fill="#fbf6ec"/>
  <circle cx="22.4" cy="32.9" r="2.9" fill="#1d1409"/>
  <circle cx="21.4" cy="31.8" r="1.05" fill="#ffffff"/>
  <ellipse cx="41.6" cy="32.6" rx="4.6" ry="5.1" fill="#fbf6ec"/>
  <circle cx="41.6" cy="32.9" r="2.9" fill="#1d1409"/>
  <circle cx="40.6" cy="31.8" r="1.05" fill="#ffffff"/>
</svg>
