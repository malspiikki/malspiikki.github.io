<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sanapato</title>
    <!-- Optional sidecars, emitted from icons/ by the build. They only resolve
         on the hosted copy; a standalone sanapato.html 404s them silently. The
         SVG favicon that has to work everywhere is inlined as a data: URI by the
         inline-favicon plugin, and lands after these so it wins where supported. -->
    <link rel="icon" href="favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f1ea;
        font-family: "Helvetica Neue", Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        cursor: default;
      }
      #mute {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: rgba(60, 50, 40, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.5;
        transition: opacity 0.15s, background 0.15s;
      }
      #mute svg {
        width: 58%;
        height: 58%;
        display: block;
      }
      #mute:hover {
        opacity: 1;
        background: rgba(60, 50, 40, 0.12);
      }
    </style>
